<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MII // SYSTEM DIAGNOSTICS</title>
<style>
:root{color-scheme:dark;--bg:#05070a;--panel:#0d151c;--line:#392127;--text:#f3e2e0;--dim:#a98783;--ok:#39ff88;--bad:#ff4560}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#240810,var(--bg) 55%);color:var(--text);font:14px ui-monospace,SFMono-Regular,Menlo,monospace;padding:32px 16px}.wrap{max-width:680px;margin:auto}h1{font-size:20px;letter-spacing:.08em;margin:0 0 8px}.sub{color:var(--dim);margin-bottom:28px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin:14px 0}.panel.error{border-color:var(--bad)}h2{font-size:14px;letter-spacing:.12em;margin:0 0 18px}.row{display:flex;justify-content:space-between;gap:20px;padding:9px 0;border-top:1px solid var(--line)}.label{color:var(--dim)}.value{font-weight:700;text-align:right}.ready{color:var(--ok)}.error,.not-configured{color:var(--bad)}.actions{display:flex;gap:10px;margin-top:24px}.btn{color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:10px 14px}
</style>
</head>
<body>
<main class="wrap">
<h1>MII AI Diagnostics</h1>
<div class="sub">Safe service readiness overview</div>
<section class="panel {{ 'error' if storage.status == 'ERROR' else '' }}" id="storagePanel">
<h2>STORAGE</h2>
<div class="row"><span class="label">STATUS</span><span class="value {{ storage.status|lower|replace(' ', '-') }}" id="storageStatus">{{ storage.status }}</span></div>
<div class="row"><span class="label">DETAIL</span><span class="value" id="storageDetail">{{ storage.detail }}</span></div>
</section>
<section class="panel {{ 'error' if generation.status == 'ERROR' else '' }}" id="generationPanel">
<h2>AI GENERATION</h2>
<div class="row"><span class="label">STATUS</span><span class="value {{ generation.status|lower|replace(' ', '-') }}" id="generationStatus">{{ generation.status }}</span></div>
<div class="row"><span class="label">DETAIL</span><span class="value" id="generationDetail">{{ generation.detail }}</span></div>
</section>
<div class="actions"><a class="btn" href="/ai-video/debug">Refresh</a><a class="btn" href="/ai-video">Back</a></div>
</main>
<script>
setInterval(function(){fetch('/api/aivideo/debug-data',{credentials:'same-origin'}).then(function(r){return r.json()}).then(function(data){
  [['storage',data.storage],['generation',data.generation]].forEach(function(pair){var name=pair[0], state=pair[1];if(!state)return;var cap=name.charAt(0).toUpperCase()+name.slice(1);var status=document.getElementById(name+'Status'),detail=document.getElementById(name+'Detail'),panel=document.getElementById(name+'Panel');status.textContent=state.status;status.className='value '+state.status.toLowerCase().replace(/ /g,'-');detail.textContent=state.detail;panel.classList.toggle('error',state.status==='ERROR')})
}).catch(function(){})},5000)
</script>
</body>
</html>
