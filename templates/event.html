function renderAll(){renderInfo();if(!tokenState)return;let s=eventData.draw_status||'locked',won=!!tokenState.is_winner,lost=!!tokenState.is_loser||(s==='finished'&&!won);$('registeredToken').textContent=tokenState.token||roomToken;$('joinedBadge').textContent=won?'WINNER':(lost?t('notWinner'):(s==='drawing'?t('drawing'):t('joined')));$('roundNow').textContent=eventData.current_round||tokenState.round||0;$('roundTotal').textContent=eventData.slot_winner||0;$('roomLead').textContent=won?t('winnerLead'):(lost?t('loserLead'):(s==='drawing'?t('drawingLead'):t('waitingLead')));renderResult(s,won,lost);if(s==='drawing'&&!finalState(s,won,lost)&&lastStatus!=='drawing')roll(eventData.countdown_seconds||10);if((s!=='drawing'||finalState(s,won,lost))&&timer){clearInterval(timer);timer=null}lastStatus=s}
function showRoom(token,state){roomToken=token;tokenState=state||tokenState;localStorage.setItem(KEY,token);$('joinPage').classList.add('hidden');$('drawRoom').classList.remove('hidden');renderAll()}function showJoin(){roomToken='';tokenState=null;$('drawRoom').classList.add('hidden');$('joinPage').classList.remove('hidden');$('drawTokenInput').value='';renderAll()}function mapError(msg){msg=String(msg||'');if(msg.includes('pernah')||msg.includes('terdaftar')||msg.includes('already'))return t('used');if(msg.includes('dibuka')||msg.includes('menerima')||msg.includes('open'))return t('locked');return t('invalid')}
async function join(){let token=$('drawTokenInput').value.trim().toUpperCase();$('error').textContent='';if(!token){$('error').textContent=t('invalid');return}$('joinDrawBtn').disabled=true;try{let r=await fetch('/api/event/join-draw?v={{ APP_VERSION }}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});let d=await r.json();if(!r.ok)throw d;eventData=d.event||eventData;showRoom(token,d)}catch(e){$('error').textContent=mapError(e.error)}finally{$('joinDrawBtn').disabled=false}}function roll(seconds){let left=Number(seconds)||10,chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';if(timer)clearInterval(timer);$('drawCountdown').textContent='00:'+String(left).padStart(2,'0');timer=setInterval(()=>{left=Math.max(0,left-1);$('drawCountdown').textContent='00:'+String(left).padStart(2,'0');let tail=Array.from({length:6},()=>chars[Math.floor(Math.random()*chars.length)]).join('');$('tokenReelTrack').innerHTML=`<span>MII-DRAW-2026-${tail}</span><span class="active">${roomToken}</span><span>MII-DRAW-2026-${tail.split('').reverse().join('')}</span><span>MII-DRAW-2026-${tail}</span><span class="active">${roomToken}</span><span>MII-DRAW-2026-${tail.split('').reverse().join('')}</span>`},1000)}
$('joinDrawBtn').addEventListener('click',join);$('drawTokenInput').addEventListener('keydown',e=>{if(e.key==='Enter')join()});$('backToEventBtn').addEventListener('click',()=>{localStorage.removeItem(KEY);showJoin()});
(async function init(){applyLang();await fetchEvent().catch(()=>{});let saved=localStorage.getItem(KEY);if(saved){try{let st=await tokenStatus(saved);if(st.valid&&st.joined_draw)showRoom(saved,st);else{localStorage.removeItem(KEY);showJoin()}}catch(e){localStorage.removeItem(KEY);showJoin()}}else showJoin();setInterval(async()=>{await fetchEvent().catch(()=>{});if(roomToken){try{let st=await tokenStatus(roomToken);showRoom(roomToken,st)}catch(e){localStorage.removeItem(KEY);showJoin()}}},5000)})();
</script>
