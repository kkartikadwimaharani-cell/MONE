<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MII Premium App Bounty</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#12070a;color:#ffe8ee;font-family:system-ui}.card{width:min(92vw,460px);padding:28px;border:1px solid #ff477744;border-radius:20px;background:#1d0d12;box-shadow:0 0 35px #ff477722}h1{color:#ff5c83;font-size:1.7rem}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;margin-top:12px}input{background:#080305;color:white;border:1px solid #ff477755}button{background:#ff4777;color:white;border:0;font-weight:700;cursor:pointer}.ok{color:#72ffad}.err{color:#ff8b8b}</style></head>
<body><main class="card"><h1>MII PREMIUM APP BOUNTY</h1><p>Masukkan Token Event dari bot Telegram MIIWEB.</p><input id="token" placeholder="MII-XXXXXX" autocomplete="off"><button id="login">Login Event</button><p id="status"></p></main><script>document.getElementById('login').onclick=async()=>{const status=document.getElementById('status');status.textContent='Memvalidasi...';status.className='';const r=await fetch('/api/event/validate-token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:document.getElementById('token').value})});const d=await r.json();if(d.valid){status.textContent='Token valid, event access granted';status.className='ok'}else{status.textContent=d.error||'Token tidak valid';status.className='err'}};</script></body>
</html>
