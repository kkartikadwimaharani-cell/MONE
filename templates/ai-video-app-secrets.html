<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>App Secrets — MII AI VIDEO</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#08070a; --bg-grid:rgba(255,22,56,.05);
  --surface:#131217; --surface-2:#1b1a20;
  --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.16);
  --text:#f3f2f5; --text-muted:#aeacb6; --text-faint:#7d7a85;
  --primary:#ff1638; --primary-2:#ff4060;
  --success:#2fd76b; --success-bg:rgba(47,215,107,.12);
  --warning:#ffb020; --warning-bg:rgba(255,176,32,.12);
  --danger:#ff3b4e; --danger-bg:rgba(255,59,78,.12);
  --shadow-card:0 16px 44px rgba(0,0,0,.4);
  --shadow-btn:0 10px 26px rgba(255,22,56,.22);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:radial-gradient(ellipse 90% 50% at 50% -10%,rgba(200,0,36,.2),transparent),var(--bg);
  color:var(--text); min-height:100vh; line-height:1.5; padding:22px 16px 90px;
  animation:pageFade .5s ease both;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(var(--bg-grid) 1px,transparent 1px),linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(ellipse 70% 55% at 50% 20%,#000 0 35%,transparent 85%)}
@keyframes pageFade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){body{animation:none}}

.wrap{position:relative;z-index:1;width:100%;max-width:600px;margin:0 auto}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);text-decoration:none;font-size:16px;font-weight:600;margin-bottom:18px}
.back-link svg{width:18px;height:18px}
.page-title{font-size:clamp(30px,8vw,36px);font-weight:800;letter-spacing:-.01em;margin-bottom:6px}
.page-sub{font-size:17px;color:var(--text-muted);margin-bottom:22px;font-weight:500}

.banner{display:flex;align-items:flex-start;gap:12px;padding:18px;border-radius:16px;margin-bottom:20px;background:var(--warning-bg);border:1px solid rgba(255,176,32,.28)}
.banner svg{width:24px;height:24px;flex:none;color:var(--warning);margin-top:1px}
.banner .txt{font-size:16px;color:var(--text);font-weight:500}
.banner .txt b{display:block;font-size:18px;margin-bottom:4px;font-weight:800}
.banner .btn{margin-top:14px;min-height:50px;font-size:16px}

.section-title{font-size:15px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--text-faint);margin:30px 2px 12px}
.section-title:first-of-type{margin-top:2px}

.card{background:linear-gradient(160deg,var(--surface),var(--surface-2));border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:12px;box-shadow:var(--shadow-card);animation:cardIn .4s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){.card{animation:none}}

.row-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.row-label{font-size:21px;font-weight:800;line-height:1.3}
.row-help{font-size:16px;color:var(--text-muted);margin-top:6px;font-weight:500}

.badge{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:99px;font-size:14px;font-weight:800;letter-spacing:.01em;white-space:nowrap;flex:none}
.badge .dot{width:7px;height:7px;border-radius:50%;flex:none}
.badge.on{background:var(--success-bg);color:var(--success)}
.badge.on .dot{background:var(--success)}
.badge.env{background:var(--warning-bg);color:var(--warning)}
.badge.env .dot{background:var(--warning)}
.badge.off{background:var(--surface-2);color:var(--text-faint);border:1px solid var(--border)}
.badge.off .dot{background:var(--text-faint)}

.footer-row{display:flex;align-items:center;justify-content:flex-end;gap:14px;margin-top:16px}

button{font-family:inherit;cursor:pointer}
.btn{min-height:48px;padding:0 20px;border:none;border-radius:12px;font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .14s ease,opacity .14s ease}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-primary{background:linear-gradient(135deg,var(--primary-2),var(--primary));color:#fff;box-shadow:var(--shadow-btn)}
.btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border-strong)}
.btn-text{background:transparent;color:var(--danger);font-size:16px;font-weight:700;min-height:44px;padding:0 4px}
@media (prefers-reduced-motion: reduce){.btn{transition:none}.btn:active{transform:none}}

.spinner{width:16px;height:16px;border-radius:50%;flex:none;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
.btn-secondary .spinner{border-color:rgba(255,255,255,.2);border-top-color:var(--text)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation:spin 1.4s linear infinite}}

.edit-panel{margin-top:18px;padding-top:18px;border-top:1px solid var(--border);animation:panelIn .22s cubic-bezier(.22,1,.36,1) both}
@keyframes panelIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){.edit-panel{animation:none}}
.input-wrap{position:relative}
input[type=text],input[type=password]{
  width:100%;min-height:54px;background:#0d0c10;border:1.5px solid var(--border-strong);border-radius:12px;
  padding:0 48px 0 16px;color:var(--text);font-size:17px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
input:focus{outline:none;border-color:var(--primary-2);box-shadow:0 0 0 4px rgba(255,22,56,.15)}
.input-icon-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:none;background:transparent;border-radius:10px;display:grid;place-items:center;color:var(--text-muted)}
.input-icon-btn:active{background:var(--surface-2)}
.input-icon-btn svg{width:20px;height:20px}
.edit-actions{display:flex;gap:10px;margin-top:14px}
.edit-actions .btn-primary{flex:1}
.edit-actions .btn-secondary{flex:1}

.hidden{display:none !important}

.skel{background:linear-gradient(90deg,var(--surface-2) 25%,rgba(255,255,255,.06) 37%,var(--surface-2) 63%);background-size:400% 100%;border-radius:8px;animation:shimmer 1.4s ease infinite;display:inline-block}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
@media (prefers-reduced-motion: reduce){.skel{animation:none;background:var(--surface-2)}}
.skel-line{height:18px;margin-bottom:10px;width:70%}
.skel-line.w2{width:40%}

.toast-host{position:fixed;left:16px;right:16px;bottom:20px;z-index:100;display:flex;flex-direction:column;gap:10px;max-width:600px;margin:0 auto}
.toast{display:flex;align-items:center;gap:10px;padding:16px 18px;border-radius:14px;font-size:16px;font-weight:600;color:var(--text);background:var(--surface-2);border:1px solid var(--border-strong);box-shadow:0 12px 40px rgba(0,0,0,.5);animation:toastIn .3s cubic-bezier(.22,1,.36,1) both}
.toast.leaving{animation:toastOut .25s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px) scale(.96)}}
@media (prefers-reduced-motion: reduce){.toast{animation:none}.toast.leaving{animation:none;opacity:0}}
.toast svg{width:21px;height:21px;flex:none}
.toast.success svg{color:var(--success)} .toast.error svg{color:var(--danger)} .toast.warning svg{color:var(--warning)} .toast.info svg{color:#8fd3ff}
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="/ai-video/debug">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    Debug page
  </a>
  <div class="page-title">App Secrets</div>
  <div class="page-sub">Simpan API key &amp; password sekali, aman, langsung aktif.</div>

  <div id="bannerHost"></div>
  <div id="listHost">
    <div class="card"><span class="skel skel-line" aria-hidden="true"></span><span class="skel skel-line w2" aria-hidden="true"></span></div>
    <div class="card"><span class="skel skel-line" aria-hidden="true"></span><span class="skel skel-line w2" aria-hidden="true"></span></div>
    <div class="card"><span class="skel skel-line" aria-hidden="true"></span><span class="skel skel-line w2" aria-hidden="true"></span></div>
  </div>
</div>

<div class="toast-host" id="toastHost"></div>

<script>
(function() {
  function readCookie(name) {
    var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  }
  var origFetch = window.fetch.bind(window);
  window.fetch = function(input, init) {
    init = init || {};
    var method = (init.method || 'GET').toUpperCase();
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    var isSameOriginApi = url.indexOf('/api/aivideo/') !== -1 || url.indexOf('/ai-video/') !== -1;
    var isRelative = url.indexOf('://') === -1;
    if (isSameOriginApi && isRelative && method !== 'GET' && method !== 'HEAD') {
      var tok = readCookie('mii_csrf');
      if (tok) init.headers = Object.assign({}, init.headers || {}, { 'X-CSRF-Token': tok });
    }
    return origFetch(input, init);
  };
})();

var ICONS = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>',
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a21.6 21.6 0 015.06-6.06M9.9 4.24A10.4 10.4 0 0112 4c7 0 11 7 11 7a21.6 21.6 0 01-2.16 3.19M14.12 14.12a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.86L1.8 18a1.6 1.6 0 001.4 2.4h17.6a1.6 1.6 0 001.4-2.4L13.7 3.86a1.6 1.6 0 00-2.8 0z"/></svg>'
};

function toast(kind, msg) {
  var host = document.getElementById('toastHost');
  var el = document.createElement('div');
  el.className = 'toast ' + kind;
  var icon = kind === 'success' ? ICONS.check : kind === 'error' ? ICONS.x : kind === 'warning' ? ICONS.warn : ICONS.info;
  el.innerHTML = icon + '<span>' + msg + '</span>';
  host.appendChild(el);
  setTimeout(function() { el.classList.add('leaving'); setTimeout(function() { el.remove(); }, 300); }, 3600);
}

function setBtnLoading(btn, loadingText) {
  btn.disabled = true;
  btn.dataset.orig = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span>' + loadingText;
}
function resetBtn(btn) { btn.disabled = false; btn.innerHTML = btn.dataset.orig; }

function badgeHTML(item) {
  if (item.key_mismatch) return '<span class="badge env"><span class="dot"></span>Isi ulang</span>';
  if (item.source === 'store') return '<span class="badge on"><span class="dot"></span>Aktif</span>';
  if (item.source === 'env') return '<span class="badge env"><span class="dot"></span>Railway env</span>';
  return '<span class="badge off"><span class="dot"></span>Kosong</span>';
}

function itemCardHTML(item) {
  var editLabel = item.configured ? 'Edit' : 'Isi';
  var inputType = item.kind === 'id' ? 'text' : 'password';
  return (
    '<div class="card" data-key="' + item.key + '">' +
      '<div class="row-top"><div class="row-label">' + item.label + '</div>' + badgeHTML(item) + '</div>' +
      '<div class="row-help">' + item.help + '</div>' +
      '<div class="footer-row">' +
        (item.source === 'store' ? '<button class="btn-text btn-remove">Hapus</button>' : '') +
        '<button class="btn btn-secondary btn-toggle-edit">' + editLabel + '</button>' +
      '</div>' +
      '<div class="edit-panel hidden">' +
        '<div class="input-wrap">' +
          '<input type="' + inputType + '" class="secret-input" placeholder="Value baru…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">' +
          (inputType === 'password' ? '<button type="button" class="input-icon-btn toggle-visibility" aria-label="Show">' + ICONS.eye + '</button>' : '') +
        '</div>' +
        '<div class="edit-actions">' +
          '<button class="btn btn-secondary btn-cancel-edit">Batal</button>' +
          '<button class="btn btn-primary btn-save">Simpan</button>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
}

function wireCard(card, item) {
  var panel = card.querySelector('.edit-panel');
  var input = card.querySelector('.secret-input');
  var toggleBtn = card.querySelector('.toggle-visibility');
  var editBtn = card.querySelector('.btn-toggle-edit');
  var cancelBtn = card.querySelector('.btn-cancel-edit');

  function openEdit() {
    panel.classList.remove('hidden');
    editBtn.classList.add('hidden');
    input.value = '';
    input.focus();
  }
  function closeEdit() {
    panel.classList.add('hidden');
    editBtn.classList.remove('hidden');
    input.value = '';
  }

  editBtn.onclick = openEdit;
  cancelBtn.onclick = closeEdit;

  if (toggleBtn) {
    toggleBtn.onclick = function() {
      var showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      this.innerHTML = showing ? ICONS.eye : ICONS.eyeOff;
    };
  }

  card.querySelector('.btn-save').onclick = function() {
    var btn = this;
    var value = input.value.trim();
    if (!value) { toast('warning', 'Isi value dulu.'); return; }
    setBtnLoading(btn, 'Simpan…');
    fetch('/api/aivideo/app-secrets/update', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: item.key, value: value }),
    })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        resetBtn(btn);
        if (res.ok) { toast('success', item.label + ' tersimpan'); loadList(); }
        else { toast('error', (res.error || {}).message || 'Gagal simpan'); }
      })
      .catch(function() { resetBtn(btn); toast('error', 'Gagal simpan'); });
  };

  var removeBtn = card.querySelector('.btn-remove');
  if (removeBtn) {
    removeBtn.onclick = function() {
      var btn = this;
      setBtnLoading(btn, 'Hapus…');
      fetch('/api/aivideo/app-secrets/delete', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: item.key }),
      })
        .then(function(r) { return r.json(); })
        .then(function(res) {
          resetBtn(btn);
          if (res.ok) { toast('success', 'Terhapus'); loadList(); }
          else { toast('error', 'Gagal hapus'); }
        })
        .catch(function() { resetBtn(btn); toast('error', 'Gagal hapus'); });
    };
  }
}

function importLegacy(btn) {
  setBtnLoading(btn, 'Import…');
  fetch('/api/aivideo/app-secrets/import-legacy', { method: 'POST' })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      resetBtn(btn);
      if (res.ok) { toast('success', 'Berhasil di-import'); loadList(); }
      else { toast('error', (res.error || {}).message || 'Import gagal'); }
    })
    .catch(function() { resetBtn(btn); toast('error', 'Import gagal'); });
}

function loadList() {
  fetch('/api/aivideo/app-secrets/list')
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (!res.ok) { toast('error', 'Gagal memuat data'); return; }
      var items = res.data.items;
      var byCategory = {};
      var order = [];
      items.forEach(function(it) {
        if (!byCategory[it.category]) { byCategory[it.category] = []; order.push(it.category); }
        byCategory[it.category].push(it);
      });

      var envUnmigrated = items.filter(function(it) { return it.source === 'env'; });
      var bannerHost = document.getElementById('bannerHost');
      if (envUnmigrated.length) {
        bannerHost.innerHTML =
          '<div class="banner">' + ICONS.warn +
          '<div class="txt"><b>' + envUnmigrated.length + ' item masih di Railway env</b>' +
          'Import sekali biar nggak perlu edit Railway lagi.' +
          '<div><button class="btn btn-secondary" id="btnImportLegacy">Import Sekarang</button></div>' +
          '</div></div>';
        document.getElementById('btnImportLegacy').onclick = function() { importLegacy(this); };
      } else {
        bannerHost.innerHTML = '';
      }

      var html = '';
      order.forEach(function(cat) {
        html += '<div class="section-title">' + cat + '</div>';
        byCategory[cat].forEach(function(it) { html += itemCardHTML(it); });
      });
      var host = document.getElementById('listHost');
      host.innerHTML = html;
      order.forEach(function(cat) {
        byCategory[cat].forEach(function(it) {
          wireCard(host.querySelector('.card[data-key="' + it.key + '"]'), it);
        });
      });
    })
    .catch(function() { toast('error', 'Koneksi gagal, cek internet kamu.'); });
}

loadList();
</script>
</body>
</html>
