<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>MII NETWORK — System Maintenance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Space+Grotesk:wght@600;700&family=Cinzel:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ asset_url('css/maintenance.css') }}">
  <link rel="stylesheet" href="{{ asset_url('css/maintenance-pet.css') }}">
</head>
<body>
  <main class="maintenance-scene" id="maintenanceScene" aria-label="MII NETWORK system maintenance">
    <div class="maintenance-portrait" aria-hidden="true"></div>
    <div class="maintenance-ambient" aria-hidden="true"></div>
    <div class="maintenance-grid" aria-hidden="true"></div>
    <div class="maintenance-vignette" aria-hidden="true"></div>

    <article class="maintenance-card">
      <div class="maintenance-embers" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="maintenance-scanlines" aria-hidden="true"></div>

      <section class="maintenance-stage">
        <div class="maintenance-panel maintenance-hero">
          <h1 class="maintenance-heading">
            <span class="maintenance-heading__system">SYSTEM</span>
            <span class="maintenance-heading__maintenance">MAINTENANCE</span>
          </h1>
          <p class="maintenance-wait">PLEASE WAIT A LITTLE LONGER</p>
        </div>

        <div class="maintenance-panel maintenance-pet-panel">
          <button class="maintenance-sleep-pet" id="maintenancePet" type="button" data-state="sleep" aria-label="Sleeping Chibi Makima. Tap to disturb her.">
            <span class="maintenance-sleep-pet__sprite"></span>
            <span class="maintenance-sleep-pet__dream" aria-hidden="true"><i>z</i><i>Z</i><i>Z</i></span>
            <span class="maintenance-sleep-pet__bubble" id="maintenancePetBubble" role="status" aria-live="polite"></span>
          </button>
        </div>

        <div class="maintenance-panel maintenance-status" aria-label="Status: maintenance">
          <span>STATUS</span>
          <strong>MAINTENANCE</strong>
        </div>

        <a class="maintenance-contact" href="https://wa.me/6282191223912" target="_blank" rel="noopener noreferrer">CONTACT SUPPORT</a>
        <a class="maintenance-community" href="{{ status.community_link or 'https://chat.whatsapp.com/DtpSUf90QIOCmxjACXAySl?s=cl&p=a&ilr=0' }}" target="_blank" rel="noopener noreferrer">{{ (status.community_btn_label or 'GABUNG') ~ ' ' ~ (status.community_name or 'COMMUNITY') }}</a>
      </section>

    </article>
  </main>
  <script src="{{ asset_url('js/mii-pet/maintenance-pet.js') }}" defer></script>
</body>
</html>
