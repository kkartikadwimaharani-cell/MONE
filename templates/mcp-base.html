<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>MII // SECURE ACCESS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#05070a;--panel:#0b1118;--line:rgba(255,32,64,.24);--hot:#ff2040;--text:#f6e9e7;--dim:#b08a87;--ok:#39ff88;--display:'Orbitron',sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box}html{font-size:16px}body{margin:0;min-height:100vh;color:var(--text);font:500 1rem/1.65 var(--mono);background:radial-gradient(ellipse at 32% -8%,rgba(255,32,64,.2),transparent 52%),linear-gradient(#080d12,var(--bg));overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,32,64,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,32,64,.04) 1px,transparent 1px);background-size:34px 34px}main{position:relative;max-width:820px;margin:auto;padding:28px 18px 80px}.topline{display:flex;justify-content:space-between;gap:12px;margin-bottom:26px;color:var(--dim);font-size:.78rem;letter-spacing:.12em}.topline strong{color:var(--ok)}header{display:flex;align-items:center;gap:18px;margin:0 0 24px}.avatar-shell{position:relative;flex:0 0 78px;width:78px;height:78px;padding:3px;border:1px solid rgba(255,32,64,.55);background:rgba(255,32,64,.08);box-shadow:0 0 26px rgba(255,32,64,.2)}.avatar-shell:before,.avatar-shell:after{content:"";position:absolute;width:10px;height:10px;border-color:var(--hot);border-style:solid}.avatar-shell:before{top:-1px;left:-1px;border-width:2px 0 0 2px}.avatar-shell:after{right:-1px;bottom:-1px;border-width:0 2px 2px 0}.avatar-shell img{display:block;width:100%;height:100%;object-fit:cover}.tag{color:var(--hot);font-weight:700;letter-spacing:.16em;font-size:.86rem}h1{font:900 clamp(1.8rem,7vw,3.25rem)/1.08 var(--display);letter-spacing:.025em;margin:7px 0 0;text-shadow:0 0 20px rgba(255,32,64,.4);overflow-wrap:anywhere}h2{font:700 clamp(1.12rem,4vw,1.45rem)/1.3 var(--display);letter-spacing:.06em;margin:0}.signal{margin:0 0 22px}.signal-head{display:flex;justify-content:space-between;color:var(--dim);font-size:.73rem;letter-spacing:.12em}.track{height:3px;background:rgba(255,255,255,.08);margin-top:9px;overflow:hidden}.bar{height:100%;width:72%;background:var(--hot);box-shadow:0 0 12px var(--hot);animation:scan 2.7s ease-in-out infinite alternate}@keyframes scan{to{width:100%}}section,.card{position:relative;padding:24px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(15,23,31,.98),rgba(7,11,16,.98));box-shadow:0 16px 38px rgba(0,0,0,.42);margin:0 0 18px}section:before,section:after,.card:before,.card:after{content:"";position:absolute;width:12px;height:12px;border-color:var(--hot);border-style:solid}.card:before,section:before{left:-1px;top:-1px;border-width:1px 0 0 1px}.card:after,section:after{right:-1px;bottom:-1px;border-width:0 1px 1px 0}p{margin:14px 0;color:#d2bdbc;line-height:1.7;overflow-wrap:anywhere}.muted,small{color:var(--dim);font-size:.88rem}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:17px}.index{flex:none;color:var(--hot);font-size:.78rem;font-weight:700;letter-spacing:.09em}.permission-list{display:grid;gap:10px;margin:20px 0;padding:0;list-style:none;counter-reset:permission}.permission-list li{counter-increment:permission;display:grid;grid-template-columns:42px minmax(0,1fr);gap:10px;padding:13px 0;border-top:1px solid rgba(255,32,64,.12);color:#f4e6e4;line-height:1.55}.permission-list li:before{content:'0' counter(permission);color:var(--hot);font-weight:700}.permission-list li:first-child{border-top:0}.safe{display:grid;grid-template-columns:20px minmax(0,1fr);gap:11px;padding:14px;margin:18px 0;background:rgba(57,255,136,.04);border:1px solid rgba(57,255,136,.2);color:#cdebd8}.safe b{color:var(--ok)}.route{display:flex;justify-content:space-between;gap:18px;padding:14px 0;border-top:1px solid rgba(255,32,64,.12);overflow-wrap:anywhere}.route span{color:var(--dim)}.route strong{text-align:right}form{margin-top:23px}.row{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.85fr);gap:11px}input,button{font:700 1rem var(--mono);min-height:56px}button{padding:14px 18px;color:#fff;background:linear-gradient(135deg,#e6193b,#ff294d);border:1px solid var(--hot);cursor:pointer;letter-spacing:.03em}button.secondary{background:rgba(255,32,64,.035);border-color:rgba(255,32,64,.35)}button:hover{box-shadow:0 0 20px rgba(255,32,64,.3)}button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}.footer-note{margin-top:24px;color:var(--dim)}
@media(max-width:520px){html{font-size:16px}main{padding:20px 14px 64px}.topline{font-size:.76rem}.avatar-shell{flex-basis:62px;width:62px;height:62px}header{gap:13px;align-items:flex-start}.tag{font-size:.78rem}h1{font-size:1.85rem}.panel-head{display:grid;grid-template-columns:minmax(0,1fr) auto}section,.card{padding:20px 17px}.row{grid-template-columns:1fr}.route{display:grid;gap:4px}.route strong{text-align:left}.permission-list li{grid-template-columns:34px minmax(0,1fr)}}@media(prefers-reduced-motion:reduce){.bar{animation:none;width:100%}}
</style>
</head>
<body><main>{% block content %}{% endblock %}</main></body>
</html>
