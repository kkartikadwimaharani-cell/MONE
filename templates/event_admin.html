<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MII Event Admin</title><style>body{background:#12070a;color:#ffe8ee;font-family:system-ui;padding:24px}input,button,textarea{padding:10px;border-radius:8px;margin:4px;background:#211017;color:white;border:1px solid #ff477755}button{background:#ff4777;border:0}.card{border:1px solid #ff477744;border-radius:16px;padding:16px;margin:14px 0;background:#1d0d12}code{color:#72ffad}pre{white-space:pre-wrap}</style></head><body><h1>MII Event Admin</h1>{% if not authed %}<form method="post"><input type="password" name="password" placeholder="Admin password"><button>Login</button></form>{% else %}<section class="card"><h2>Statistik</h2><pre>{{ stats }}</pre></section><section class="card"><h2>Tambah Reward Code</h2><form method="post" action="/admin-panel/reward"><input name="code" placeholder="CODE"><input name="name" placeholder="Nama reward"><input name="type" placeholder="type"><input name="max_claim" type="number" value="1"><input name="expires_at" placeholder="YYYY-MM-DD"><button>Simpan</button></form></section><section class="card"><h2>Tambah Reward Stock</h2><form method="post" action="/admin-panel/stock"><input name="reward_code" placeholder="REWARD_CODE"><textarea name="content" placeholder="detail hadiah"></textarea><button>Tambah Stock</button></form></section><section class="card"><h2>Reward Codes</h2><pre>{{ reward_codes }}</pre></section><section class="card"><h2>Claim History</h2><pre>{{ claims }}</pre></section>{% endif %}</body></html>
