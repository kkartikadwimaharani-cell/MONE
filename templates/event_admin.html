<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MII Reward Draw Admin</title><style>body{background:#12070a;color:#ffe8ee;font-family:system-ui;padding:24px}input,button,textarea{padding:10px;border-radius:8px;margin:4px;background:#211017;color:white;border:1px solid #ff477755}button{background:#ff4777;border:0;cursor:pointer}.card{border:1px solid #ff477744;border-radius:16px;padding:16px;margin:14px 0;background:#1d0d12}code{color:#72ffad}pre{white-space:pre-wrap}.row{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><h1>MII Reward Draw Admin</h1>{% if not authed %}<form method="post"><input type="password" name="password" placeholder="Admin password"><button>Login</button></form>{% else %}<section class="card"><h2>Status Draw</h2><p>Event: <code>{{ event_status|upper }}</code></p><p>Info Hadiah: <code>{{ reward_info }}</code></p><div class="row"><form method="post" action="/admin-panel/event-status"><input type="hidden" name="status" value="locked"><button>🔒 LOCK DRAW</button></form><form method="post" action="/admin-panel/event-status"><input type="hidden" name="status" value="open"><button>🟢 OPEN DRAW</button></form></div><form method="post" action="/admin-panel/reward-info"><textarea name="reward_info" placeholder="MII Reward Draw | 1 Winner | Token via Bot MIIWEB">{{ reward_info }}</textarea><button>🎁 Simpan Info Hadiah</button></form></section><section class="card"><h2>Statistik</h2><pre>{{ stats }}</pre></section><section class="card"><h2>Tambah Reward Code</h2><form method="post" action="/admin-panel/reward"><input name="code" placeholder="CODE"><input name="name" placeholder="Nama reward"><input name="type" placeholder="type"><input name="max_claim" type="number" value="1"><input name="expires_at" placeholder="YYYY-MM-DD"><button>Simpan</button></form></section><section class="card"><h2>Tambah Reward Stock</h2><form method="post" action="/admin-panel/stock"><input name="reward_code" placeholder="REWARD_CODE"><textarea name="content" placeholder="detail hadiah"></textarea><button>Tambah Stock</button></form></section><section class="card"><h2>Reward Codes</h2><pre>{{ reward_codes }}</pre></section><section class="card"><h2>Claim History</h2><pre>{{ claims }}</pre></section>{% endif %}</body></html>
