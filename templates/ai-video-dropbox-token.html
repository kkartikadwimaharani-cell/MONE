<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>MII // DROPBOX CONNECTION</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#05070a;--bg2:#080d12;--panel:#0a1016;--panel2:#0d151c;
  --border:rgba(255,32,64,.2);--border-dim:rgba(255,32,64,.1);--border-strong:rgba(255,32,64,.35);
  --cyan:#ff2040;--cyan-dim:rgba(255,32,64,.5);
  --magenta:#ff6a00;--amber:#ffb300;
  --ok:#39ff88;--ok-bg:rgba(57,255,136,.08);
  --bad:#ff2547;--bad-glow:rgba(255,37,71,.55);--bad-bg:rgba(255,37,71,.1);
  --txt:#f3e2e0;--dim:#8a5f5c;--faint:rgba(247,220,216,.32);
  --disp:'Orbitron',sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  --shadow-card:0 16px 44px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
::selection{background:var(--cyan);color:#1a0407}
body{
  font-family:var(--mono);color:var(--txt);min-height:100vh;line-height:1.6;
  padding:20px 14px 90px;position:relative;overflow-x:hidden;
  background:
    radial-gradient(ellipse 90% 50% at 50% -10%, rgba(255,32,64,.12), transparent 60%),
    radial-gradient(ellipse 70% 40% at 100% 100%, rgba(255,106,0,.08), transparent 60%),
    linear-gradient(var(--bg2), var(--bg));
  animation:pageFade .5s ease both;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.5;
  background-image:linear-gradient(rgba(255,32,64,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(255,32,64,.06) 1px, transparent 1px);
  background-size:34px 34px;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, #000 40%, transparent 90%);
}
body::after{
  content:'';position:fixed;left:0;right:0;height:120px;pointer-events:none;z-index:2;
  background:linear-gradient(rgba(255,32,64,0), rgba(255,32,64,.07) 45%, rgba(255,32,64,0));
  animation:scanSweep 6s linear infinite;
}
@keyframes scanSweep{0%{top:-120px}100%{top:100vh}}
@keyframes pageFade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){body,body::after{animation:none}}

.wrap{position:relative;z-index:3;width:100%;max-width:560px;margin:0 auto}

.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--dim);text-decoration:none;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:18px;transition:color .15s ease}
.back-link svg{width:14px;height:14px}
.back-link:active,.back-link:hover{color:var(--cyan)}

.page-header{margin-bottom:20px}
.hud-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.hud-mark{width:44px;height:44px;border-radius:10px;flex-shrink:0;position:relative;background:linear-gradient(135deg,#1a0407,#2e0009);border:1px solid var(--cyan-dim);display:grid;place-items:center;color:var(--cyan);font-family:var(--disp);font-weight:900;font-size:18px;box-shadow:0 0 22px rgba(255,32,64,.3), inset 0 0 14px rgba(255,32,64,.12)}
.hud-mark::before{content:'';position:absolute;inset:-1px;border-radius:11px;border:1px solid var(--magenta);opacity:.35;animation:markPulse 2.6s ease-in-out infinite}
@keyframes markPulse{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:.55;transform:scale(1.06)}}
.page-title{font-family:var(--disp);font-weight:800;font-size:clamp(17px,5.6vw,20px);letter-spacing:.06em;text-transform:uppercase;color:#fff0ef;text-shadow:0 0 12px rgba(255,32,64,.5);margin-bottom:4px}
.page-sub{font-size:10.5px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;font-weight:600}

.status-pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:3px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--border-dim);background:rgba(255,255,255,.03);color:var(--dim)}
.status-pill .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--dim)}
.status-pill.connected{background:var(--ok-bg);color:var(--ok);border-color:rgba(57,255,136,.3)}
.status-pill.connected .dot{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pipBlink 1.6s ease-in-out infinite}
@keyframes pipBlink{0%,100%{opacity:1}50%{opacity:.35}}
.status-pill.warn{background:rgba(255,179,0,.1);color:var(--amber);border-color:rgba(255,179,0,.3)}
.status-pill.warn .dot{background:var(--amber)}
.status-pill.off{background:rgba(255,255,255,.03);color:var(--dim)}
.status-pill.error{background:var(--bad-bg);color:var(--bad);border-color:rgba(255,37,71,.4)}
.status-pill.error .dot{background:var(--bad);box-shadow:0 0 8px var(--bad)}
@media (prefers-reduced-motion: reduce){.status-pill.connected .dot{animation:none}}

.card{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--border-dim);border-radius:4px;padding:20px 18px;margin-bottom:14px;box-shadow:var(--shadow-card);animation:cardIn .45s cubic-bezier(.22,1,.36,1) both}
.card::before,.card::after{content:'';position:absolute;width:10px;height:10px;border-color:var(--cyan-dim);border-style:solid;opacity:.8}
.card::before{top:-1px;left:-1px;border-width:1px 0 0 1px}
.card::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){.card, body{animation:none}}

.card-icon-row{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.card-icon{width:48px;height:48px;border-radius:4px;flex:none;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,32,64,.14),rgba(255,106,0,.06));border:1px solid var(--border)}
.card-icon svg{width:24px;height:24px}
.card-title{font-family:var(--disp);font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fff0ef}
.card-desc{font-size:10.5px;color:var(--dim);margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}

.helper-text{font-size:11.5px;color:var(--dim);line-height:1.6;margin-bottom:16px;font-weight:500;text-transform:uppercase;letter-spacing:.02em}
.helper-text b{color:var(--txt);font-weight:700}

button{font-family:inherit;cursor:pointer}
.btn{width:100%;min-height:46px;border:1px solid var(--border);border-radius:3px;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:9px;background:rgba(255,32,64,.04);color:var(--cyan);transition:transform .15s ease,background .15s ease,border-color .15s ease,box-shadow .15s ease}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn:disabled{opacity:.5;pointer-events:none}
.btn:hover{border-color:var(--cyan);box-shadow:0 0 16px -6px var(--cyan-dim)}
.btn-primary{background:linear-gradient(135deg,rgba(255,32,64,.24),rgba(255,106,0,.2));border-color:var(--cyan);color:#fff0ef}
.btn-secondary{background:rgba(255,255,255,.03);color:var(--txt);border:1px solid var(--border-strong)}
.btn-danger{background:var(--bad-bg);color:var(--bad);border:1px solid rgba(255,59,78,.35)}
.btn-danger:hover{background:rgba(255,37,71,.16);box-shadow:0 0 16px -6px var(--bad-glow)}
.btn-ghost{background:transparent;color:var(--dim);border:1px solid var(--border-dim)}
.btn-row{display:flex;gap:10px;margin-top:10px}
.btn-row .btn{flex:1}
@media (prefers-reduced-motion: reduce){.btn{transition:none}.btn:active{transform:none}}

.spinner{width:15px;height:15px;border-radius:50%;flex:none;border:2px solid rgba(255,240,239,.3);border-top-color:#fff0ef;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation:spin 1.4s linear infinite}}

.field{margin-bottom:16px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--txt);margin-bottom:8px}
.input-wrap{position:relative}
input[type=text],input[type=password]{width:100%;min-height:48px;background:#020304;border:1px solid var(--border-strong);border-radius:3px;padding:0 44px 0 14px;color:var(--txt);font-size:13.5px;font-family:var(--mono);transition:border-color .15s ease,box-shadow .15s ease}
input[type=text].plain{padding-right:14px}
input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(255,32,64,.15)}
.input-icon-btn{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:none;background:transparent;border-radius:3px;display:grid;place-items:center;color:var(--dim)}
.input-icon-btn:active{background:rgba(255,255,255,.05)}
.input-icon-btn svg{width:18px;height:18px}

.code-box{background:#020304;border:1px solid var(--border-strong);border-radius:3px;padding:14px;font-family:var(--mono);font-size:12px;word-break:break-all;line-height:1.55;color:var(--cyan);margin-bottom:12px}

.progress{display:flex;align-items:center;margin-bottom:26px}
.progress .step{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;position:relative}
.progress .step .num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-size:12px;font-weight:800;background:var(--panel2);color:var(--dim);border:1px solid var(--border-strong);transition:all .25s ease}
.progress .step.active .num{background:linear-gradient(135deg,var(--cyan),var(--magenta));color:#fff0ef;border-color:transparent;box-shadow:0 0 14px -2px var(--cyan-dim)}
.progress .step.done .num{background:var(--ok);color:#06170c;border-color:transparent}
.progress .step .lbl{font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);text-align:center}
.progress .step.active .lbl{color:var(--txt)}
.progress .step.done .lbl{color:var(--ok)}
.progress .line{flex:1;height:1px;background:var(--border-strong);margin:0 -2px 20px;position:relative;top:-11px}
.progress .line.done{background:var(--ok)}

.info-list{margin-bottom:16px}
.info-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--border-dim);font-size:11px}
.info-row:last-child{border-bottom:none}
.info-row .k{color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.info-row .v{font-size:12px;font-weight:700;text-align:right;color:#fff0ef}
.info-row .v.mono{font-family:var(--mono);font-size:11px}
.info-row .v.ok{color:var(--ok)}

.skel{background:linear-gradient(90deg,rgba(255,255,255,.03) 25%,rgba(255,32,64,.08) 37%,rgba(255,255,255,.03) 63%);background-size:400% 100%;border-radius:3px;animation:shimmer 1.4s ease infinite;display:inline-block}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
@media (prefers-reduced-motion: reduce){.skel{animation:none}}
.skel-line{height:13px;margin-bottom:9px;width:100%}
.skel-line.short{width:55%}
.skel-pill{height:28px;width:130px;border-radius:3px}

.success-icon{width:70px;height:70px;margin:6px auto 18px;position:relative}
.success-icon svg{width:100%;height:100%}
.success-icon circle.ring{stroke-dasharray:145;stroke-dashoffset:145;animation:ringDraw .6s ease forwards}
.success-icon path.check{stroke-dasharray:40;stroke-dashoffset:40;animation:checkDraw .35s .5s ease forwards}
@keyframes ringDraw{to{stroke-dashoffset:0}}
@keyframes checkDraw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.success-icon circle.ring,.success-icon path.check{animation:none;stroke-dashoffset:0}}

.banner{display:flex;align-items:flex-start;gap:12px;padding:14px;border-radius:4px;margin-bottom:16px;background:rgba(255,179,0,.08);border:1px solid rgba(255,179,0,.3);animation:cardIn .4s ease both}
.banner svg{width:20px;height:20px;flex:none;color:var(--amber);margin-top:1px}
.banner .txt{font-size:11.5px;color:var(--txt);font-weight:500;text-transform:uppercase;letter-spacing:.02em}
.banner .txt b{display:block;font-size:13px;margin-bottom:5px;font-weight:800;font-family:var(--disp);letter-spacing:.04em}

.toast-host{position:fixed;left:16px;right:16px;bottom:20px;z-index:100;display:flex;flex-direction:column;gap:10px;max-width:560px;margin:0 auto}
.toast{display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:4px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--txt);background:var(--panel);border:1px solid var(--border-strong);box-shadow:0 12px 40px rgba(0,0,0,.6);animation:toastIn .3s cubic-bezier(.22,1,.36,1) both}
.toast.leaving{animation:toastOut .25s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px) scale(.96)}}
@media (prefers-reduced-motion: reduce){.toast{animation:none}.toast.leaving{animation:none;opacity:0}}
.toast svg{width:18px;height:18px;flex:none}
.toast.success{border-color:rgba(57,255,136,.35)} .toast.success svg{color:var(--ok)}
.toast.error{border-color:rgba(255,37,71,.4)} .toast.error svg{color:var(--bad)}
.toast.warning{border-color:rgba(255,179,0,.35)} .toast.warning svg{color:var(--amber)}
.toast.info svg{color:var(--cyan)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s ease}
.modal-overlay.open{opacity:1;pointer-events:auto}
@media (min-width:640px){.modal-overlay{align-items:center}}
.modal{position:relative;width:100%;max-width:420px;background:var(--panel);border:1px solid var(--border-strong);border-radius:6px 6px 0 0;padding:24px 20px 26px;transform:translateY(20px) scale(.98);opacity:0;transition:all .25s cubic-bezier(.22,1,.36,1);max-height:90vh;overflow-y:auto}
.modal::before,.modal::after{content:'';position:absolute;width:10px;height:10px;border-color:var(--cyan-dim);border-style:solid;opacity:.8}
.modal::before{top:-1px;left:-1px;border-width:1px 0 0 1px}
.modal::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
.modal-overlay.open .modal{transform:translateY(0) scale(1);opacity:1}
@media (min-width:640px){.modal{border-radius:6px}}
@media (prefers-reduced-motion: reduce){.modal-overlay,.modal{transition:none}}
.modal-title{font-family:var(--disp);font-size:15px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px;color:#fff0ef}
.modal-desc{font-size:11.5px;color:var(--dim);margin-bottom:20px;line-height:1.6;font-weight:500;text-transform:uppercase;letter-spacing:.02em}

.hidden{display:none !important}
.text-center{text-align:center}
.mt-6{margin-top:6px}

/* Shared studio diagnostics palette: luminous graphite, crisp state colors. */
:root{--bg:#111820;--bg2:#1c2430;--panel:#26303c;--panel2:#303844;--border:rgba(255,91,139,.31);--border-dim:rgba(255,115,154,.17);--border-strong:rgba(255,119,160,.42);--cyan:#ff416f;--cyan-dim:rgba(255,65,111,.58);--magenta:#ff8aa7;--amber:#ffd080;--ok:#48eca5;--ok-bg:rgba(72,236,165,.17);--bad:#ff748b;--bad-glow:rgba(255,116,139,.5);--bad-bg:rgba(255,116,139,.17);--txt:#fff7f9;--dim:#d2bdc5;--faint:rgba(255,240,245,.53);--shadow-card:0 18px 46px rgba(0,6,18,.3)}

body::before{opacity:.2}
body::after{background:linear-gradient(rgba(255,75,119,0),rgba(255,75,119,.13) 45%,rgba(255,75,119,0))}

.page-sub,.card-desc,.helper-text,.info-row .k{color:#e0cbd3}
.status-pill{border-radius:999px;padding:9px 14px;background:rgba(255,255,255,.09)}

.btn-primary:hover{background:linear-gradient(115deg,#ff3869,#bf1849)}
.btn-secondary{background:rgba(245,249,255,.1);border-color:rgba(255,171,195,.33)}

input[type=text],input[type=password],.code-box{background:#19222d;border-radius:10px}
.toast,.modal{background:linear-gradient(145deg,#343b48,#242d38);border-radius:14px}

</style>
</head>

<script>
(function() {
  function readCookie(name) {
    var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  }
  var origFetch = window.fetch.bind(window);
  window.fetch = function(input, init) {
    init = init || {};
    var method = (init.method || 'GET').toUpperCase();
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    var isSameOriginApi = url.indexOf('/api/aivideo/') !== -1 || url.indexOf('/ai-video/') !== -1;
    var isRelative = url.indexOf('://') === -1;
    if (isSameOriginApi && isRelative && method !== 'GET' && method !== 'HEAD') {
      var tok = readCookie('mii_csrf');
      if (tok) init.headers = Object.assign({}, init.headers || {}, { 'X-CSRF-Token': tok });
    }
    return origFetch(input, init);
  };
})();

  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>',
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a21.6 21.6 0 015.06-6.06M9.9 4.24A10.4 10.4 0 0112 4c7 0 11 7 11 7a21.6 21.6 0 01-2.16 3.19M14.12 14.12a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.86L1.8 18a1.6 1.6 0 001.4 2.4h17.6a1.6 1.6 0 001.4-2.4L13.7 3.86a1.6 1.6 0 00-2.8 0z"/></svg>'
};

function toast(kind, msg) {
  var host = document.getElementById('toastHost');
  var el = document.createElement('div');
  el.className = 'toast ' + kind;
  var icon = kind === 'success' ? ICONS.check : kind === 'error' ? ICONS.x : kind === 'warning' ? ICONS.warn : ICONS.info;
  el.innerHTML = icon + '<span>' + msg + '</span>';
  host.appendChild(el);
  setTimeout(function() {
    el.classList.add('leaving');
    setTimeout(function() { el.remove(); }, 300);
  }, 3600);
}

var STATE = null;
var wizardStep = 1;

function qs(name) { return new URLSearchParams(window.location.search).get(name); }

function renderStatusPill(data) {
  var host = document.getElementById('statusPillHost');
  var state = data && data.state;
  var map = {
    connected: ['warn', 'Connected · Verify Token'],
    legacy_not_migrated: ['warn', 'Legacy Config Detected'],
    credentials_saved: ['warn', 'Setup In Progress'],
    key_mismatch: ['error', 'Reauthorization Required'],
    not_connected: ['off', 'Not Connected'],
  };
  var v = map[state] || ['off', 'Not Connected'];
  if (state === 'connected' && data.last_test_ok === false) v = ['error', 'Connection Test Failed'];
  else if (state === 'connected' && data.last_test_ok === true && data.last_test_at
           && Date.now() / 1000 - data.last_test_at < 600)
    v = ['connected', 'Connection Verified'];
  host.innerHTML = '<span class="status-pill ' + v[0] + '"><span class="dot"></span>' + v[1] + '</span>';
}

function renderBanner(data) {
  var host = document.getElementById('bannerHost');
  if (data.key_mismatch) {
    host.innerHTML =
      '<div class="banner">' + ICONS.warn +
      '<div class="txt"><b>Reauthorization Required</b>' +
      'The server\'s encryption key changed since Dropbox was last connected (usually because FLASK_SECRET_KEY isn\'t set to a fixed value). Please reconnect Dropbox below.' +
      '</div></div>';
    return;
  }
  if (data.legacy_import_available) {
    host.innerHTML =
      '<div class="banner">' + ICONS.warn +
      '<div class="txt"><b>Existing Dropbox Configuration Detected</b>' +
      'DROPBOX_APP_KEY / DROPBOX_APP_SECRET / DROPBOX_REFRESH_TOKEN found in environment variables.' +
      '<div class="btn-row"><button class="btn btn-secondary" id="btnImportLegacy" style="min-height:44px">Import Configuration</button></div>' +
      '</div></div>';
    document.getElementById('btnImportLegacy').onclick = function() { importLegacy(this); };
  } else {
    host.innerHTML = '';
  }
}

function renderMain() {
  var host = document.getElementById('mainHost');
  if (STATE.state === 'connected') {
    host.innerHTML = connectedCardHTML(STATE);
    wireConnectedCard();
  } else {
    host.innerHTML = notConnectedCardHTML();
    document.getElementById('btnConfigure').onclick = function() { openWizard(); };
  }
}

function notConnectedCardHTML() {
  return (
    '<div class="card">' +
      '<div class="card-icon-row"><div class="card-icon">' + ICONS.cloud + '</div>' +
      '<div><div class="card-title">Dropbox</div><div class="card-desc">Cloud Storage Integration</div></div></div>' +
      '<div class="helper-text">Connect Dropbox tanpa copy-paste token manual, tanpa edit Railway.</div>' +
      '<button class="btn btn-primary" id="btnConfigure">Configure Dropbox</button>' +
    '</div>'
  );
}

function fmtTime(ts) {
  if (!ts) return '—';
  try { return new Date(ts * 1000).toLocaleString(); } catch (e) { return '—'; }
}

function escapeText(value) {
  var el = document.createElement('span');
  el.textContent = value || '—';
  return el.innerHTML;
}

function tokenHealth(d) {
  if (d.last_test_ok === false) return '<span class="v" style="color:var(--bad)">Test Failed</span>';
  if (d.last_test_ok === true && d.last_test_at && Date.now() / 1000 - d.last_test_at < 600)
    return '<span class="v ok">Recently Verified</span>';
  return '<span class="v" style="color:var(--amber)">Not Recently Tested</span>';
}

function connectedCardHTML(d) {
  return (
    '<div class="card">' +
      '<div class="card-icon-row"><div class="card-icon">' + ICONS.cloud + '</div>' +
      '<div><div class="card-title">Dropbox</div><div class="card-desc">Connected &amp; Auto-Refreshing</div></div></div>' +
      '<div class="info-list">' +
        '<div class="info-row"><span class="k">Account</span><span class="v">' + escapeText(d.account_name) + '</span></div>' +
        '<div class="info-row"><span class="k">Account ID</span><span class="v mono">' + escapeText(d.account_id_masked) + '</span></div>' +
        '<div class="info-row"><span class="k">Auto Refresh</span><span class="v">' + (d.source === 'oauth' ? 'Enabled' : 'Legacy Configuration') + '</span></div>' +
        '<div class="info-row"><span class="k">Access Token</span>' + tokenHealth(d) + '</div>' +
        '<div class="info-row"><span class="k">Last Refresh</span><span class="v">' + fmtTime(d.last_refresh_at) + '</span></div>' +
        '<div class="info-row"><span class="k">Last Connection Test</span><span class="v">' + fmtTime(d.last_test_at) + '</span></div>' +
        '<div class="info-row"><span class="k">Scopes</span><span class="v mono" style="text-align:right;max-width:60%">' + escapeText(d.scope) + '</span></div>' +
      '</div>' +
      '<button class="btn btn-secondary" id="btnTest">Test Connection</button>' +
      '<div class="btn-row">' +
        '<button class="btn btn-secondary" id="btnReconnect">Reconnect</button>' +
        '<button class="btn btn-danger" id="btnDisconnect">Disconnect</button>' +
      '</div>' +
      '<a class="btn btn-secondary" href="/ai-video/debug">Open System Diagnostics</a>' +
    '</div>'
  );
}

function setBtnLoading(btn, loadingText, originalText) {
  btn.disabled = true;
  btn.dataset.orig = originalText;
  btn.innerHTML = '<span class="spinner"></span>' + loadingText;
}
function resetBtn(btn) { btn.disabled = false; btn.textContent = btn.dataset.orig; }

function wireConnectedCard() {
  document.getElementById('btnTest').onclick = function() {
    var btn = this;
    setBtnLoading(btn, 'Testing…', 'Test Connection');
    fetch('/api/aivideo/dropbox/test', { method: 'POST' })
      .then(function(r) { return r.json().then(function(d) { return { status: r.status, data: d }; }); })
      .then(function(res) {
        resetBtn(btn);
        if (res.data.ok) { toast('success', 'Connection test successful'); loadStatus(); }
        else {
          var code = (res.data.error || {}).code;
          if (code === 'DROPBOX_REAUTH_REQUIRED') toast('warning', 'Reauthorization required — please reconnect.');
          else toast('error', (res.data.error || {}).message || 'Connection failed');
          loadStatus();
        }
      })
      .catch(function() { resetBtn(btn); toast('error', 'Connection failed'); });
  };
  document.getElementById('btnReconnect').onclick = function() { openWizard(true); };
  document.getElementById('btnDisconnect').onclick = function() { document.getElementById('disconnectOverlay').classList.add('open'); };
}

document.getElementById('btnCancelDisconnect').onclick = function() {
  document.getElementById('disconnectOverlay').classList.remove('open');
};
function doDisconnect(mode, btn) {
  setBtnLoading(btn, 'Disconnecting…', btn.textContent);
  fetch('/api/aivideo/dropbox/disconnect', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ mode: mode }),
  })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      document.getElementById('disconnectOverlay').classList.remove('open');
      resetBtn(btn);
      if (res.ok) { toast('success', 'Dropbox disconnected'); loadStatus(); }
      else { toast('error', 'Disconnect failed'); }
    })
    .catch(function() { resetBtn(btn); toast('error', 'Disconnect failed'); });
}
document.getElementById('btnDisconnectAccount').onclick = function() { doDisconnect('tokens', this); };
document.getElementById('btnRemoveConfig').onclick = function() { doDisconnect('all', this); };

function importLegacy(btn) {
  setBtnLoading(btn, 'Importing…', 'Import existing configuration');
  fetch('/api/aivideo/dropbox/import-legacy', { method: 'POST' })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      resetBtn(btn);
      if (res.ok) { toast('success', 'Existing configuration imported'); loadStatus(); }
      else { toast('error', (res.error || {}).message || 'Import failed'); }
    })
    .catch(function() { resetBtn(btn); toast('error', 'Import failed'); });
}

function loadStatus() {
  fetch('/api/aivideo/dropbox/status')
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (!res.ok) { toast('error', 'Failed to load connection status'); return; }
      STATE = res.data;
      renderStatusPill(STATE);
      renderBanner(STATE);
      renderMain();
    })
    .catch(function() { toast('error', 'Connection failed — check your internet connection.'); });
}

function openWizard() {
  wizardStep = (STATE && STATE.has_app_credentials) ? 2 : 1;
  document.getElementById('mainHost').innerHTML = wizardHTML();
  goToStep(wizardStep);
  wireWizard();
}

function step(n, label) { return '<div class="step" data-step="' + n + '"><div class="num">' + n + '</div><div class="lbl">' + label + '</div></div>'; }
function line() { return '<div class="line"></div>'; }

function wizardHTML() {
  return (
    '<div class="card">' +
      '<div class="progress" id="wizProgress">' +
        step('1', 'Credentials') + line() + step('2', 'Redirect URI') + line() + step('3', 'Authorize') + line() + step('4', 'Connected') +
      '</div>' +
      '<div id="wizStep1">' +
        '<div class="card-title mt-6" style="margin-bottom:4px">Application Credentials</div>' +
        '<div class="helper-text">Isi App Key &amp; Secret dari Dropbox App Console.</div>' +
        '<div class="field"><label for="fAppKey">App Key</label>' +
          '<input type="text" class="plain" id="fAppKey" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="e.g. 8vak3xy2z1a2b3c"></div>' +
        '<div class="field"><label for="fAppSecret">App Secret</label>' +
          '<div class="input-wrap"><input type="password" id="fAppSecret" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="App secret">' +
          '<button type="button" class="input-icon-btn" id="toggleSecret" aria-label="Show secret">' + ICONS.eye + '</button></div></div>' +
        '<button class="btn btn-primary" id="btnSaveCreds">Save &amp; Continue</button>' +
      '</div>' +
      '<div id="wizStep2" class="hidden">' +
        '<div class="card-title mt-6" style="margin-bottom:4px">Configure Redirect URI</div>' +
        '<div class="helper-text">Tambahkan URL ini ke Dropbox App Console.</div>' +
        '<div class="code-box" id="redirectUriBox">…</div>' +
        '<div class="btn-row" style="margin-top:0;margin-bottom:18px"><button class="btn btn-secondary" id="btnCopyUri">' + ICONS.copy + ' Copy Redirect URI</button></div>' +
        '<div class="helper-text">App Console → Settings → OAuth 2 → Redirect URIs</div>' +
        '<button class="btn btn-primary" id="btnUriAdded">I&#39;ve Added The Redirect URI</button>' +
      '</div>' +
      '<div id="wizStep3" class="hidden">' +
        '<div class="card-title mt-6" style="margin-bottom:4px">Connect Your Dropbox</div>' +
        '<div class="helper-text">Izinkan akses ke akun Dropbox kamu.</div>' +
        '<button class="btn btn-primary" id="btnConnectDropbox">Connect Dropbox</button>' +
      '</div>' +
      '<div id="wizStep4" class="hidden text-center">' +
        '<div class="success-icon"><svg viewBox="0 0 52 52" fill="none">' +
          '<circle class="ring" cx="26" cy="26" r="23" stroke="var(--ok)" stroke-width="3"/>' +
          '<path class="check" d="M15 27l7 7 15-15" stroke="var(--ok)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>' +
        '</svg></div>' +
        '<div class="card-title" style="margin-bottom:6px">Dropbox Connected</div>' +
        '<div class="helper-text">Auto-refresh token aktif — nggak perlu setting lagi.</div>' +
        '<div class="info-list" id="step4Info" style="text-align:left"></div>' +
        '<button class="btn btn-primary" id="btnWizardDone">Done</button>' +
      '</div>' +
    '</div>'
  );
}

function goToStep(n) {
  wizardStep = n;
  for (var i = 1; i <= 4; i++) document.getElementById('wizStep' + i).classList.toggle('hidden', i !== n);
  var steps = document.querySelectorAll('#wizProgress .step');
  var lines = document.querySelectorAll('#wizProgress .line');
  steps.forEach(function(el) {
    var s = parseInt(el.dataset.step, 10);
    el.classList.toggle('done', s < n);
    el.classList.toggle('active', s === n);
  });
  lines.forEach(function(el, idx) { el.classList.toggle('done', idx + 1 < n); });
}

function wireWizard() {
  if (wizardStep === 2) prefillRedirectUri();
  document.getElementById('toggleSecret').onclick = function() {
    var input = document.getElementById('fAppSecret');
    var showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    this.innerHTML = showing ? ICONS.eye : ICONS.eyeOff;
  };
  document.getElementById('btnSaveCreds').onclick = function() {
    var btn = this;
    var appKey = document.getElementById('fAppKey').value.trim();
    var appSecret = document.getElementById('fAppSecret').value.trim();
    if (!appKey || !appSecret) { toast('warning', 'App Key and App Secret are required.'); return; }
    setBtnLoading(btn, 'Saving…', 'Save & Continue');
    fetch('/api/aivideo/dropbox/credentials', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ app_key: appKey, app_secret: appSecret }),
    })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        resetBtn(btn);
        if (res.ok) {
          toast('success', 'Configuration saved');
          if (STATE) STATE.redirect_uri = (res.data && res.data.redirect_uri) || STATE.redirect_uri;
          goToStep(2);
          prefillRedirectUri();
        } else {
          toast('error', (res.error || {}).message || 'Failed to save credentials');
        }
      })
      .catch(function() { resetBtn(btn); toast('error', 'Failed to save credentials'); });
  };
  document.getElementById('btnCopyUri').onclick = function() {
    var text = document.getElementById('redirectUriBox').textContent;
    navigator.clipboard.writeText(text).then(function() { toast('info', 'Redirect URI copied'); })
      .catch(function() { toast('error', 'Copy failed — select and copy manually.'); });
  };
  document.getElementById('btnUriAdded').onclick = function() { goToStep(3); };
  document.getElementById('btnConnectDropbox').onclick = function() {
    var btn = this;
    setBtnLoading(btn, 'Redirecting to Dropbox…', 'Connect Dropbox');
    fetch('/api/aivideo/dropbox/authorize', { method: 'POST' })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.ok) { window.location.href = res.data.authorize_url; }
        else { resetBtn(btn); toast('error', (res.error || {}).message || 'Failed to start authorization'); }
      })
      .catch(function() { resetBtn(btn); toast('error', 'Failed to start authorization'); });
  };
}

function prefillRedirectUri() {
  document.getElementById('redirectUriBox').textContent = (STATE && STATE.redirect_uri) || '';
}

function handleQueryParams() {
  var connected = qs('connected');
  var error = qs('dropbox_error');
  var url = new URL(window.location.href);
  if (connected) { url.searchParams.delete('connected'); window.history.replaceState({}, '', url.toString()); }
  if (error) {
    url.searchParams.delete('dropbox_error');
    window.history.replaceState({}, '', url.toString());
    var messages = {
      state_mismatch: 'Security check failed (state mismatch) — please try connecting again.',
      state_expired: 'Authorization session expired — please try connecting again.',
      missing_code: 'Dropbox did not return an authorization code — please try again.',
      exchange_failed: 'Could not complete the Dropbox connection — please try again.',
      access_denied: 'Dropbox authorization was cancelled.',
    };
    toast('error', messages[error] || 'Dropbox connection failed — please try again.');
  }
  return { connected: !!connected };
}

(function init() {
  var q = handleQueryParams();
  fetch('/api/aivideo/dropbox/status')
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (!res.ok) { toast('error', 'Failed to load connection status'); return; }
      STATE = res.data;
      renderStatusPill(STATE);
      renderBanner(STATE);
      if (q.connected && STATE.state === 'connected') {
        document.getElementById('mainHost').innerHTML = wizardHTML();
        goToStep(4);
        document.getElementById('step4Info').innerHTML =
          '<div class="info-row"><span class="k">Account</span><span class="v">' + (STATE.account_name || '—') + '</span></div>' +
          '<div class="info-row"><span class="k">Auto Refresh</span><span class="v ok">Enabled</span></div>' +
          '<div class="info-row"><span class="k">Token Status</span><span class="v ok">Healthy</span></div>';
        document.getElementById('btnWizardDone').onclick = function() { renderMain(); };
      } else {
        renderMain();
      }
    })
    .catch(function() { toast('error', 'Connection failed — check your internet connection.'); });
})();
</script>
</body>
</html>
