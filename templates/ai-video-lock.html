<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#ff1638;--red2:#ff4060;
  --font-display:"Avenir Next","SF Pro Display","Segoe UI Variable Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-body:"Avenir Next","SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--font-body);
  background:radial-gradient(ellipse 90% 60% at 50% 0%,rgba(200,0,36,.30),transparent),#040205;
  color:#fff;display:flex;align-items:center;justify-content:center;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,22,56,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,22,56,.04) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000 0 40%,transparent 85%);
}

.lockbox{
  position:relative;z-index:1;width:min(360px,88vw);
  display:flex;flex-direction:column;align-items:center;gap:20px;
  padding:40px 28px;border-radius:22px;
  border:1px solid rgba(255,22,56,.24);
  background:linear-gradient(145deg,rgba(18,5,10,.86),rgba(3,2,5,.97));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 30px 90px rgba(0,0,0,.50);
  animation:boxIn .5s cubic-bezier(.22,1,.36,1) both;
}
@keyframes boxIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

.logo-ring{
  width:84px;height:84px;border-radius:50%;
  display:grid;place-items:center;position:relative;
  background:radial-gradient(circle,rgba(255,22,56,.22),transparent 70%);
}
.logo-ring::before{
  content:"";position:absolute;inset:-6px;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(255,22,56,0),rgba(255,60,90,.9),rgba(255,22,56,0) 45%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));
  animation:ringSpin 3.2s linear infinite;
}
.logo-ring::after{
  content:"";position:absolute;inset:6px;border-radius:50%;
  border:1.5px solid rgba(255,22,56,.45);
  animation:ringPulse 2.4s ease-in-out infinite;
}
@keyframes ringSpin{to{transform:rotate(360deg)}}
@keyframes ringPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.12);opacity:1}}
.logo-m{font-size:2.1rem;font-weight:900;color:var(--red);text-shadow:0 0 20px rgba(255,0,48,.60);position:relative;z-index:1;animation:logoBreathe 2.4s ease-in-out infinite}
@keyframes logoBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

.brand-title{font-family:var(--font-display);font-size:1.5rem;font-weight:900;letter-spacing:-.02em;text-transform:uppercase;text-align:center}
.brand-sub{font-size:.72rem;font-weight:700;letter-spacing:.22em;color:rgba(255,220,228,.50);text-transform:uppercase}

.pw-field{
  width:100%;position:relative;
}
.pw-input{
  width:100%;padding:14px 16px;border-radius:12px;
  border:1px solid rgba(255,22,56,.28);background:rgba(255,255,255,.04);
  color:#fff;font-family:var(--font-body);font-size:.95rem;letter-spacing:.06em;
  text-align:center;
}
.pw-input::placeholder{color:rgba(255,225,230,.30);letter-spacing:.04em}
.pw-input:focus{outline:none;border-color:rgba(255,60,90,.65);box-shadow:0 0 0 3px rgba(255,22,56,.10)}
.pw-input:disabled{opacity:.45;cursor:not-allowed}

/* Attempt "lives": 3 shield pips showing tries left. One cracks and fades
   red on every wrong password so the danger is felt, not just read. */
.attempts-row{display:flex;gap:10px;justify-content:center}
.attempt-pip{width:30px;height:30px;position:relative;filter:drop-shadow(0 0 4px rgba(255,60,90,.35))}
.attempt-pip svg{width:100%;height:100%;transition:transform .25s,filter .25s}
.attempt-pip .pip-fill{fill:rgba(255,60,90,.16);stroke:rgba(255,90,110,.75)}
.attempt-pip .pip-crack{opacity:0;stroke:#fff;transition:opacity .15s}
.attempt-pip.lost{animation:pipLost .55s cubic-bezier(.36,.07,.19,.97) both}
.attempt-pip.lost .pip-fill{fill:rgba(255,20,40,.5);stroke:#ff2840}
.attempt-pip.lost .pip-crack{opacity:1}
.attempt-pip.lost svg{filter:drop-shadow(0 0 10px rgba(255,20,50,.85))}
@keyframes pipLost{
  0%{transform:scale(1) rotate(0)}
  20%{transform:scale(1.25) rotate(-8deg)}
  45%{transform:scale(.9) rotate(6deg)}
  70%{transform:scale(1.06) rotate(-3deg)}
  100%{transform:scale(1) rotate(0);opacity:.35}
}

/* Full-screen "hit" pulse fires once per wrong attempt, on top of
   everything, so a wrong password is FELT the instant it's submitted. */
.hit-flash{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse 70% 55% at 50% 45%,rgba(255,10,40,.35),transparent 70%);opacity:0}
.hit-flash.go{animation:hitFlash .5s ease-out}
@keyframes hitFlash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}

.lockbox.shake{animation:boxShake .5s cubic-bezier(.36,.07,.19,.97) both,boxDanger .5s ease-out both}
@keyframes boxShake{
  0%,100%{transform:translateX(0) rotate(0)}
  15%{transform:translateX(-9px) rotate(-1deg)}
  30%{transform:translateX(8px) rotate(1deg)}
  45%{transform:translateX(-7px) rotate(-.6deg)}
  60%{transform:translateX(6px) rotate(.6deg)}
  75%{transform:translateX(-4px) rotate(-.3deg)}
  90%{transform:translateX(2px) rotate(0)}
}
@keyframes boxDanger{
  0%{border-color:rgba(255,22,56,.24);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 30px 90px rgba(0,0,0,.50)}
  25%{border-color:#ff2840;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 30px 90px rgba(0,0,0,.50),0 0 46px rgba(255,20,50,.55)}
  100%{border-color:rgba(255,22,56,.24);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 30px 90px rgba(0,0,0,.50)}
}

.pw-input.shake{animation:inputShakeHard .5s cubic-bezier(.36,.07,.19,.97) both}
@keyframes inputShakeHard{
  0%,100%{transform:translateX(0);border-color:rgba(255,22,56,.28);box-shadow:none}
  15%{transform:translateX(-11px);border-color:#ff2840;box-shadow:0 0 0 4px rgba(255,20,50,.16)}
  30%{transform:translateX(10px)}
  45%{transform:translateX(-8px)}
  60%{transform:translateX(6px);border-color:#ff2840;box-shadow:0 0 0 4px rgba(255,20,50,.10)}
  75%{transform:translateX(-4px)}
  90%{transform:translateX(2px)}
}

.locked-msg{
  font-size:.78rem;color:var(--red2);font-weight:700;text-align:center;
  background:rgba(255,22,56,.1);border:1px solid rgba(255,22,56,.3);border-radius:12px;
  padding:12px 14px;line-height:1.5;display:none;
}
.locked-msg.show{display:block;animation:boxIn .3s cubic-bezier(.22,1,.36,1) both}
.locked-msg b{color:#fff}

/* Wrong-password alert uses a proper danger pill (icon + message), not
   plain floating text, entrance with a sharp pop + its own red glow. */
.err-msg{
  display:none;align-items:center;gap:9px;text-align:left;
  font-size:.78rem;color:#fff;font-weight:700;
  background:linear-gradient(135deg,rgba(255,22,56,.22),rgba(255,22,56,.06));
  border:1px solid rgba(255,40,64,.55);border-radius:12px;padding:11px 14px;
  box-shadow:0 0 22px rgba(255,20,50,.22);
}
.err-msg.show{display:flex;animation:errPop .32s cubic-bezier(.22,1,.36,1) both}
@keyframes errPop{0%{opacity:0;transform:translateY(-6px) scale(.96)}60%{opacity:1;transform:translateY(1px) scale(1.015)}100%{transform:translateY(0) scale(1)}}
.err-ico{width:18px;height:18px;flex-shrink:0;color:#ff3050;filter:drop-shadow(0 0 5px rgba(255,20,50,.7))}
.err-ico svg{width:100%;height:100%;animation:errIcoPulse 1s ease-in-out infinite}
@keyframes errIcoPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.err-txt{flex:1}


.unlock-btn{
  width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,50,80,.50);
  background:linear-gradient(135deg,#ff1e3c,#a80018 55%,#2c0008);
  color:#fff;font-family:var(--font-display);font-size:.85rem;font-weight:800;
  letter-spacing:.10em;text-transform:uppercase;cursor:pointer;
  box-shadow:0 0 26px rgba(255,0,48,.24),0 12px 30px rgba(0,0,0,.30);
  transition:transform .16s,box-shadow .16s;
}
.unlock-btn:hover{transform:translateY(-2px);box-shadow:0 0 36px rgba(255,0,48,.34),0 16px 38px rgba(0,0,0,.36)}
.unlock-btn:disabled{opacity:.5;cursor:not-allowed}

.back-link{
  width:100%;min-height:45px;padding:10px 14px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  border:1px solid rgba(255,255,255,.085);
  background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,23,75,.035));
  color:rgba(255,239,243,.66);text-decoration:none;
  font-family:var(--font-display);font-size:.66rem;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
  transition:transform .18s ease,border-color .18s ease,background .18s ease,color .18s ease,box-shadow .18s ease;
}
.back-link-icon{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:rgba(255,23,75,.09);color:#ff6b87;border:1px solid rgba(255,73,108,.18)}
.back-link-icon svg{width:13px;height:13px}
.back-link:hover,.back-link:focus-visible{transform:translateY(-1px);color:#fff;border-color:rgba(255,71,104,.32);background:linear-gradient(135deg,rgba(255,255,255,.065),rgba(255,23,75,.075));box-shadow:0 12px 30px -20px rgba(255,23,75,.9),inset 0 1px 0 rgba(255,255,255,.06);outline:none}
.back-link:active{transform:translateY(0)}

/* Visitor counter is informational and auto-detected. device_id lives in
   localStorage so a refresh from the same browser never re-counts;
   only a genuinely new device bumps the total server-side. */
.visit-pill{
  display:flex;align-items:center;gap:9px;padding:9px 16px 9px 12px;border-radius:12px;
  border:1px solid rgba(255,22,56,.28);
  background:rgba(255,255,255,.04);
  position:relative;overflow:hidden;
}
.visit-pill::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.10) 50%,transparent 70%);
  background-size:220% 100%;animation:visitSheen 3.4s ease-in-out infinite;
}
@keyframes visitSheen{0%{background-position:160% 0}100%{background-position:-60% 0}}
.visit-dot{width:7px;height:7px;border-radius:50%;background:#3cff8a;box-shadow:0 0 8px #3cff8a;flex-shrink:0;animation:visitDotPulse 1.6s ease-in-out infinite}
@keyframes visitDotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.75)}}
.visit-num{font-family:var(--font-display);font-weight:900;font-size:1.02rem;color:#fff;text-shadow:0 0 14px rgba(255,60,90,.55);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.visit-lbl{font-size:.64rem;font-weight:700;letter-spacing:.05em;color:rgba(255,225,230,.55);text-transform:uppercase;position:relative;z-index:1}

/* Total attempts and failed attempts are global lifetime counters across
   all devices. Same family as the visitor pill but as two compact boxes
   side by side so all three numbers read together at a glance. */
.stats-row{display:flex;gap:8px;width:100%}
.stat-box{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 6px;border-radius:14px;
  border:1px solid rgba(255,22,56,.22);background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(255,255,255,.01));
  position:relative;overflow:hidden}
.stat-box::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.06) 50%,transparent 70%);background-size:220% 100%;animation:visitSheen 3.8s ease-in-out infinite}
.stat-box.fail{border-color:rgba(255,30,60,.4)}
.stat-ico{width:15px;height:15px;color:rgba(255,225,230,.5);position:relative;z-index:1}
.stat-box.fail .stat-ico{color:#ff4060}
.stat-num{font-family:var(--font-display);font-weight:900;font-size:1.1rem;color:#fff;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.stat-box.fail .stat-num{color:#ff4060;text-shadow:0 0 12px rgba(255,20,50,.55)}
.stat-lbl{font-size:.56rem;font-weight:700;letter-spacing:.05em;color:rgba(255,225,230,.5);text-transform:uppercase;text-align:center;position:relative;z-index:1}
.stat-num.bump{animation:statBump .4s cubic-bezier(.34,1.56,.64,1) both}
@keyframes statBump{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
  
/* Premium private-gateway layer. No third-party fonts or assets are loaded. */
:root{--red:#ff174b;--red2:#ff4768;--ink:#070407;--panel:#10070b;--line:rgba(255,71,104,.22);--muted:rgba(255,235,240,.56);--green:#49f5a5}
html,body{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto}
body{
  min-height:100dvh;padding:28px 14px;font-family:var(--font-body);
  background:
    radial-gradient(circle at 50% -10%,rgba(255,23,75,.28),transparent 38%),
    radial-gradient(circle at 8% 58%,rgba(113,0,34,.18),transparent 32%),
    radial-gradient(circle at 92% 70%,rgba(84,0,28,.16),transparent 30%),
    linear-gradient(160deg,#080307 0%,#030204 58%,#080308 100%);
}
body::before{background-image:linear-gradient(rgba(255,55,90,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,55,90,.035) 1px,transparent 1px);background-size:38px 38px;mask-image:radial-gradient(ellipse 76% 68% at 50% 42%,#000 0 42%,transparent 88%)}
body::after{content:"";position:fixed;inset:-40%;pointer-events:none;background:conic-gradient(from 180deg at 50% 50%,transparent,rgba(255,23,75,.055),transparent 30%);animation:ambientSpin 18s linear infinite}
@keyframes ambientSpin{to{transform:rotate(360deg)}}
.lockbox{
  width:min(430px,calc(100vw - 28px));gap:14px;padding:25px;border-radius:28px;isolation:isolate;
  border:1px solid rgba(255,69,102,.25);
  background:linear-gradient(155deg,rgba(34,8,17,.91),rgba(8,5,8,.97) 56%,rgba(18,4,10,.96));
  box-shadow:0 42px 120px rgba(0,0,0,.72),0 0 70px rgba(255,0,55,.12),inset 0 1px 0 rgba(255,255,255,.07);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
}
.lockbox::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.06),transparent 22%,transparent 70%,rgba(255,23,75,.045));z-index:-1}
.lockbox::after{content:"";position:absolute;left:22%;right:22%;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--red),transparent);box-shadow:0 0 18px var(--red)}
.gateway-bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 2px 8px;border-bottom:1px solid rgba(255,255,255,.065)}
.gateway-kicker{font-size:.58rem;font-weight:800;letter-spacing:.18em;color:rgba(255,235,240,.42);text-transform:uppercase}
.gateway-status{display:inline-flex;align-items:center;gap:6px;font-size:.58rem;font-weight:800;letter-spacing:.12em;color:rgba(220,255,239,.78);text-transform:uppercase}
.gateway-status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(73,245,165,.85);animation:visitDotPulse 1.8s ease-in-out infinite}
.brand-block{display:flex;flex-direction:column;align-items:center;gap:7px;padding:2px 0 0}
.logo-ring{width:76px;height:76px;background:radial-gradient(circle,rgba(255,23,75,.20),transparent 68%);filter:drop-shadow(0 14px 28px rgba(255,0,55,.15))}
.logo-ring::before{inset:-5px;background:conic-gradient(from 0deg,transparent,rgba(255,66,103,.95),transparent 42%)}
.logo-ring::after{border-color:rgba(255,77,110,.42)}
.logo-m{font-size:2rem;color:var(--red);text-shadow:0 0 26px rgba(255,23,75,.72)}
.brand-title{font-size:1.62rem;letter-spacing:-.035em;font-weight:850}
.brand-sub{margin-top:0!important;font-size:.61rem;letter-spacing:.26em;color:rgba(255,225,233,.47)}
.protocol-card{width:100%;display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:11px;padding:12px;border:1px solid rgba(255,62,96,.24);border-radius:16px;background:linear-gradient(120deg,rgba(255,23,75,.11),rgba(255,255,255,.025));box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
.protocol-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#ff264f,#79001d);box-shadow:0 10px 24px -12px rgba(255,23,75,.9)}
.protocol-icon svg{width:19px;height:19px}
.protocol-copy{min-width:0;display:flex;flex-direction:column;gap:3px}
.protocol-copy span{font-size:.52rem;font-weight:800;letter-spacing:.15em;color:rgba(255,225,233,.43);text-transform:uppercase}
.protocol-copy strong{font-family:var(--font-display);font-size:.68rem;font-weight:750;line-height:1.35;letter-spacing:.02em;color:rgba(255,247,249,.92)}
.protocol-badges{display:flex;flex-direction:column;gap:4px}
.protocol-badges b{min-width:37px;padding:3px 6px;border-radius:7px;border:1px solid rgba(255,73,108,.32);background:rgba(255,23,75,.08);color:#ff6b87;font-size:.5rem;letter-spacing:.1em;text-align:center}
.visit-pill{width:100%;justify-content:center;padding:9px 12px;border-radius:13px;border-color:rgba(255,255,255,.075);background:rgba(255,255,255,.026)}
.visit-dot{background:var(--green);box-shadow:0 0 12px rgba(73,245,165,.8)}
.stats-row{gap:7px}
.stat-box{padding:9px 6px;border-radius:13px;background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(255,255,255,.012))}
.stat-box.fail .stat-num{color:var(--red2);text-shadow:0 0 15px rgba(255,23,75,.65)}
.auth-panel{width:100%;display:flex;flex-direction:column;gap:11px;padding:14px;border-radius:18px;border:1px solid rgba(255,255,255,.07);background:rgba(0,0,0,.19);box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}
.field-label{display:flex;align-items:center;justify-content:space-between;font-size:.56rem;font-weight:800;letter-spacing:.14em;color:rgba(255,232,238,.46);text-transform:uppercase}
.field-label span:last-child{color:rgba(73,245,165,.64)}
.pw-field{position:relative}
.pw-field-icon{position:absolute;left:14px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:rgba(255,226,233,.42);pointer-events:none}
.pw-field-icon svg{width:100%;height:100%}
.pw-input{padding:14px 46px 14px 42px;border-radius:13px;border-color:rgba(255,62,96,.24);background:rgba(255,255,255,.035);font-family:inherit;text-align:left;letter-spacing:.11em}
.pw-input:focus{border-color:rgba(255,75,109,.72);box-shadow:0 0 0 3px rgba(255,23,75,.10),0 0 28px rgba(255,23,75,.08)}
.pw-toggle{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:10px;background:transparent;color:rgba(255,230,236,.42);display:grid;place-items:center;cursor:pointer}
.pw-toggle:hover{background:rgba(255,255,255,.05);color:#fff}
.pw-toggle svg{width:17px;height:17px}
.attempts-row{min-height:25px;gap:8px}
.attempt-pip{width:25px;height:25px}
.unlock-btn{min-height:50px;padding:14px;border-radius:14px;background:linear-gradient(110deg,#ff254e 0%,#d10031 48%,#760019 100%);box-shadow:0 16px 34px -18px rgba(255,23,75,.95),inset 0 1px 0 rgba(255,255,255,.22)}
.unlock-btn span{display:inline-flex;align-items:center;gap:10px}
.unlock-btn svg{width:15px;height:15px;transition:transform .18s ease}
.unlock-btn:hover svg{transform:translateX(2px)}
.security-note{display:flex;align-items:center;justify-content:center;gap:7px;color:rgba(255,229,235,.38);font-size:.58rem;font-weight:700;letter-spacing:.055em;text-align:center}
.security-note svg{width:14px;height:14px;color:rgba(73,245,165,.65)}
.back-link{font-size:.62rem}
.gateway-bar,.brand-block,.protocol-card,.visit-pill,.stats-row,.field-label,.err-msg,.locked-msg,.unlock-btn,.security-note,.back-link{text-transform:uppercase}
.pw-input::placeholder{text-transform:uppercase}
@media(max-width:420px){
  body{padding:16px 10px}.lockbox{width:min(100%,390px);padding:20px 17px;border-radius:24px;gap:12px}
  .gateway-kicker{letter-spacing:.12em}.brand-title{font-size:1.46rem}.protocol-card{grid-template-columns:34px minmax(0,1fr) auto;padding:10px;gap:9px}.protocol-icon{width:34px;height:34px}.protocol-copy strong{font-size:.62rem}.visit-lbl{font-size:.56rem}.stat-lbl{font-size:.52rem}.auth-panel{padding:12px}
}
@media(max-height:730px){body{align-items:flex-start}.lockbox{margin:auto}.logo-ring{width:64px;height:64px}.brand-block{gap:4px}.protocol-card{padding-block:9px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>

<div class="hit-flash" id="hitFlash"></div>

<main class="lockbox" id="lockbox">
  <div class="gateway-bar">
    <span class="gateway-kicker">MII SECURE GATEWAY</span>
    <span class="gateway-status">SECURED</span>
  </div>

  <header class="brand-block">
    <div class="logo-ring"><span class="logo-m">M</span></div>
    <div class="brand-title">MII AI STUDIO</div>
    <div class="brand-sub" style="margin-top:6px">PRIVATE WORKSPACE</div>
  </header>

  <section class="protocol-card" aria-label="STUDIO CONNECTIVITY">
    <div class="protocol-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9 4 12l4 3"/><path d="m16 9 4 3-4 3"/><path d="m14 5-4 14"/></svg></div>
    <div class="protocol-copy"><span>MCP AND CLI READY</span><strong>MII AI STUDIO NOW SUPPORTS SECURE MCP AND CLI ACCESS</strong></div>
    <div class="protocol-badges" aria-hidden="true"><b>MCP</b><b>CLI</b></div>
  </section>

  <div class="visit-pill" id="visitPill" title="TOTAL UNIQUE DEVICES THAT HAVE VISITED THIS PAGE">
    <span class="visit-dot"></span>
    <span class="visit-num" id="visitNum">0</span>
    <span class="visit-lbl">UNIQUE VISITORS</span>
  </div>

  <div class="stats-row" id="statsRow">
    <div class="stat-box" title="TOTAL WORKSPACE ACCESS ATTEMPTS">
      <svg class="stat-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span class="stat-num" id="statAttempts">0</span>
      <span class="stat-lbl">ACCESS ATTEMPTS</span>
    </div>
    <div class="stat-box fail" title="TOTAL DENIED WORKSPACE ACCESS ATTEMPTS">
      <svg class="stat-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/></svg>
      <span class="stat-num" id="statFailed">0</span>
      <span class="stat-lbl">DENIED ATTEMPTS</span>
    </div>
  </div>

  <section class="auth-panel" aria-label="WORKSPACE AUTHENTICATION">
    <div class="field-label"><span>WORKSPACE ACCESS KEY</span><span>ENCRYPTED</span></div>
    <div class="pw-field">
      <span class="pw-field-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>
      <input type="password" id="pwInput" class="pw-input" placeholder="ENTER WORKSPACE PASSWORD" autocomplete="current-password" autocapitalize="none" spellcheck="false" maxlength="256" aria-label="MII AI STUDIO PASSWORD" />
      <button class="pw-toggle" id="pwToggle" type="button" aria-label="SHOW PASSWORD"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button>
    </div>

    <div class="attempts-row" id="attemptsRow" aria-label="REMAINING ACCESS ATTEMPTS"></div>

    <div class="err-msg" id="errMsg" role="alert" aria-live="polite">
      <span class="err-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 17h.01"/></svg></span>
      <span class="err-txt" id="errTxt"></span>
    </div>
    <div class="locked-msg" id="lockedMsg" role="status" aria-live="polite"></div>

    <button class="unlock-btn" id="unlockBtn" type="button"><span>UNLOCK STUDIO <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span></button>
  </section>
  <div class="security-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 20 6v6c0 5-3.4 8.4-8 9.5C7.4 20.4 4 17 4 12V6l8-3Z"/><path d="m9 12 2 2 4-4"/></svg><span>ENCRYPTED SESSION. WORKSPACE DATA STAYS PRIVATE.</span></div>
  <a href="/" class="back-link"><span class="back-link-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10 17-5-5 5-5"/><path d="M5 12h14"/></svg></span><span>BACK TO HOME</span></a>
</main>

<script>
var input = document.getElementById('pwInput');
var btn = document.getElementById('unlockBtn');
var err = document.getElementById('errMsg');
var errTxt = document.getElementById('errTxt');
var lockedMsg = document.getElementById('lockedMsg');
var lockbox = document.getElementById('lockbox');
var hitFlash = document.getElementById('hitFlash');
var attemptsRow = document.getElementById('attemptsRow');
var pwToggle = document.getElementById('pwToggle');
var countdownTimer = null;
var TOTAL_ATTEMPTS = 3;
var UNLOCK_BUTTON_HTML = '<span>UNLOCK STUDIO <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span>';

function formatMMSS(sec) {
  var m = Math.floor(sec / 60), s = sec % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

// 3 "shield" pips = 3 tries. attemptsLeft=null -> show all full (fresh
// state / just unlocked from a lockout). Every wrong password drops one,
// with a crack+fade animation on that exact pip so it reads as a hit,
// not just a number changing.
function renderAttemptPips(attemptsLeft) {
  if (attemptsLeft == null) attemptsLeft = TOTAL_ATTEMPTS;
  var lostCount = TOTAL_ATTEMPTS - attemptsLeft;
  var html = '';
  for (var i = 0; i < TOTAL_ATTEMPTS; i++) {
    var isLost = i < lostCount;
    html += '<span class="attempt-pip' + (isLost ? ' lost' : '') + '" data-i="' + i + '">' +
      '<svg viewBox="0 0 24 24"><path class="pip-fill" d="M12 2.5 20 6v6c0 5-3.4 8.4-8 9.5C7.4 20.4 4 17 4 12V6l8-3.5Z" stroke-width="1.6"/>' +
      '<path class="pip-crack" d="M12 6 9.5 12l3 1-2 5" stroke-width="1.4" fill="none"/></svg></span>';
  }
  attemptsRow.innerHTML = html;
}
renderAttemptPips(TOTAL_ATTEMPTS);

function triggerHitEffect() {
  hitFlash.classList.remove('go'); void hitFlash.offsetWidth; hitFlash.classList.add('go');
  lockbox.classList.remove('shake'); void lockbox.offsetWidth; lockbox.classList.add('shake');
  input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake');
  if (navigator.vibrate) { try { navigator.vibrate([18, 40, 18]); } catch(e) {} }
  setTimeout(function() {
    lockbox.classList.remove('shake');
    input.classList.remove('shake');
  }, 520);
}

function enterLockedState(retryAfter) {
  input.disabled = true;
  btn.disabled = true;
  err.classList.remove('show');
  lockedMsg.classList.add('show');
  var remaining = retryAfter;
  if (countdownTimer) clearInterval(countdownTimer);
  function tick() {
    if (remaining <= 0) {
      clearInterval(countdownTimer);
      lockedMsg.classList.remove('show');
      input.disabled = false;
      btn.disabled = false;
      btn.innerHTML = UNLOCK_BUTTON_HTML;
      renderAttemptPips(TOTAL_ATTEMPTS); // server resets the fail count once the lock expires
      return;
    }
    lockedMsg.innerHTML = 'THIS DEVICE IS TEMPORARILY LOCKED AFTER THREE FAILED ATTEMPTS.<br>TRY AGAIN IN <b>' + formatMMSS(remaining) + '</b>';
    remaining -= 1;
  }
  tick();
  countdownTimer = setInterval(tick, 1000);
}

function doUnlock() {
  var pw = input.value.trim();
  if (!pw) { showError('ENTER YOUR WORKSPACE PASSWORD.'); return; }
  input.value = '';
  btn.disabled = true;
  btn.textContent = 'AUTHENTICATING...';
  fetch('/ai-video/unlock', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    credentials: 'same-origin',
    cache: 'no-store',
    referrerPolicy: 'no-referrer',
    body: JSON.stringify({password: pw})
  })
  .then(function(r) { return r.json().then(function(data) { return { status: r.status, data: data }; }); })
  .then(function(res) {
    var data = res.data;
    updateAttemptStats(data);
    if (data.ok) {
      err.classList.remove('show');
      window.location.href = {{ next_page|default('/ai-video')|tojson }};
      return;
    }
    if (data.locked) {
      renderAttemptPips(0);
      triggerHitEffect();
      enterLockedState(data.retry_after || 300);
      return;
    }
    if (typeof data.attempts_left === 'number') renderAttemptPips(data.attempts_left);
    showError('ACCESS DENIED. CHECK YOUR PASSWORD.');
    btn.disabled = false;
    btn.innerHTML = UNLOCK_BUTTON_HTML;
    input.focus();
  })
  .catch(function() {
    showError('CONNECTION FAILED. PLEASE TRY AGAIN.');
    btn.disabled = false;
    btn.innerHTML = UNLOCK_BUTTON_HTML;
    input.focus();
  });
}

function showError(msg) {
  errTxt.textContent = msg;
  err.classList.remove('show'); void err.offsetWidth; err.classList.add('show');
  triggerHitEffect();
}

input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doUnlock();
});
btn.addEventListener('click', doUnlock);
pwToggle.addEventListener('click', function() {
  var reveal = input.type === 'password';
  input.type = reveal ? 'text' : 'password';
  pwToggle.setAttribute('aria-label', reveal ? 'HIDE PASSWORD' : 'SHOW PASSWORD');
  input.focus();
});

var initialRetryAfter = {{ (retry_after or 0) | tojson }};
if (initialRetryAfter > 0) {
  enterLockedState(initialRetryAfter);
} else {
  input.focus();
}

// Visitor counter.
// One random device ID is stored in localStorage. Reloading from the same
// browser updates last-seen time without incrementing the unique total.
function getOrCreateDeviceId() {
  var KEY = 'mii_aivideo_device_id';
  try {
    var existing = localStorage.getItem(KEY);
    if (existing) return existing;
    var id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() :
      'dev-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
    localStorage.setItem(KEY, id);
    return id;
  } catch (e) {
    // If localStorage is unavailable, use a non-persistent per-tab ID.
    return 'dev-session-' + Math.random().toString(36).slice(2, 12);
  }
}

function animateVisitNum(el, from, to) {
  var start = null;
  var dur = 900;
  from = Math.max(0, from | 0);
  to = Math.max(0, to | 0);
  if (from === to) { el.textContent = to.toLocaleString('en-US'); return; }
  function step(ts) {
    if (start === null) start = ts;
    var p = Math.min((ts - start) / dur, 1);
    var eased = 1 - Math.pow(1 - p, 3);
    var val = Math.round(from + (to - from) * eased);
    el.textContent = val.toLocaleString('en-US');
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

(function trackLockVisit() {
  var numEl = document.getElementById('visitNum');
  var initialTotal = {{ (visit_total or 0) | tojson }};
  if (numEl) animateVisitNum(numEl, 0, initialTotal);
  var deviceId = getOrCreateDeviceId();
  fetch('/ai-video/lock-visit', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    credentials: 'same-origin',
    cache: 'no-store',
    referrerPolicy: 'no-referrer',
    body: JSON.stringify({device_id: deviceId})
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (numEl && data && typeof data.total === 'number' && data.total !== initialTotal) {
      animateVisitNum(numEl, initialTotal, data.total);
    }
  })
  .catch(function() { /* Visitor tracking is non-critical and fails silently. */ });
})();

// Global access-attempt statistics across devices.
var statAttemptsEl = document.getElementById('statAttempts');
var statFailedEl = document.getElementById('statFailed');
var curAttempts = {{ (total_attempts or 0) | tojson }};
var curFailed = {{ (total_failed or 0) | tojson }};
if (statAttemptsEl) animateVisitNum(statAttemptsEl, 0, curAttempts);
if (statFailedEl) animateVisitNum(statFailedEl, 0, curFailed);

function updateAttemptStats(data) {
  if (!data) return;
  if (typeof data.total_attempts === 'number' && statAttemptsEl) {
    var na = data.total_attempts;
    if (na !== curAttempts) {
      animateVisitNum(statAttemptsEl, curAttempts, na);
      statAttemptsEl.classList.remove('bump'); void statAttemptsEl.offsetWidth; statAttemptsEl.classList.add('bump');
    }
    curAttempts = na;
  }
  if (typeof data.total_failed === 'number' && statFailedEl) {
    var nf = data.total_failed;
    if (nf !== curFailed) {
      animateVisitNum(statFailedEl, curFailed, nf);
      statFailedEl.classList.remove('bump'); void statFailedEl.offsetWidth; statFailedEl.classList.add('bump');
    }
    curFailed = nf;
  }
}
</script>

</body>
</html>
